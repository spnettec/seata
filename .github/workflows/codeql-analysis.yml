name: "CodeQL"

on:
  workflow_dispatch:
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ 2.x, develop ]
  schedule:
    - cron: '36 19 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3

      # step 2: Initializes the CodeQL tools for scanning.
      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: "Set up Java JDK25"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Select and verify fork dependency source
        timeout-minutes: 25
        if: github.repository == 'spnettec/seata'
        id: dependency-source
        env:
          YOFC_MAVEN_USERNAME: ${{ secrets.YOFC_MAVEN_USERNAME }}
          YOFC_MAVEN_PASSWORD: ${{ secrets.YOFC_MAVEN_PASSWORD }}
        run: python3 .github/scripts/select_maven_source.py

      - name: Build with Maven
        env:
          CI_MAVEN_SETTINGS: ${{ steps.dependency-source.outputs.settings }}
        run: ./mvnw ${CI_MAVEN_SETTINGS:+-s "$CI_MAVEN_SETTINGS"} -T 4C clean install -DskipTests

      # step 3
      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"