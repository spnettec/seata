name: "test"

on:
  push:
    branches: [ test*, "*.*.*" ]
jobs:
  # job 1
  test:
    name: "test"
    runs-on: "${{ matrix.os }}"
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
        os: [
          macos-14,
          windows-2022, # Skip tests, because too many errors in unit-test.
        ]
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
      # step 2
      - name: "Use Python 3.x"
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'
      # step 3
      - name: "Set up Java JDK"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      # step 4
      ## step 4.1: for Ubuntu and MacOS
      - name: "Test with Maven on '${{ matrix.os }}' OS"
        if: ${{ ! startsWith(matrix.os, 'windows') }}
        run: |
          if [[ "${{ matrix.os }}" =~ "macos" ]]; then
             python3 -m ensurepip --upgrade;
             python3 -m pip install --upgrade pip setuptools;
             if ! python3 -c "import distutils" &>/dev/null; then
                python3 -m pip install --upgrade setuptools
             fi
            ./mvnw -T 4C clean test -P args-for-client-test  -P arrch64 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn;
          else
            ./mvnw -T 4C clean test -P args-for-client-test -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn;
          fi
      ## step 4.2: for Windows
      - name: "Build with Maven on 'windows' OS (Skip tests)"
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: | # Skip tests, because too many errors in unit-test.
          ./mvnw.cmd -version;
          ./mvnw.cmd clean install -P args-for-client-test -DskipTests -e -B -D org.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn;
